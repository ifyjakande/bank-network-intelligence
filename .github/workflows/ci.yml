name: ci

# docs-only changes (README, screenshots, clips) skip CI, and so skip the redeploy too
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [generator, etl]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock
      - run: uv sync --frozen
      - name: lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: types
        run: uv run mypy
      - name: unit tests
        run: uv run pytest -q

  dashboards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generated dashboards and alert rules match their source
        run: python3 grafana/build.py --check

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: secrets in git history
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose
      - name: vulnerable dependencies
        run: >
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs /src
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: misconfigurations (dockerfiles, compose, iac)
        run: >
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config /src
          --severity HIGH,CRITICAL --exit-code 1

  integration:
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # short lateness so "no lost sessions" can be checked a couple of minutes in
      NETGEN_LATE_MAX_S: "30"
      # traffic follows a daily curve that swings 22x, so the clock is pinned (below) and the
      # load sized for a 2-vCPU runner: about 230 sessions/s on every run, at any hour
      NETGEN_LOAD_FACTOR: "2"
      # only the faults the tests inject, so results do not depend on the time of day
      NETGEN_FAULT_SCHEDULE: none
      INTEGRATION_SETTLE_MIN: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - name: pin the simulated clock to a weekday afternoon
        run: |
          python3 - >> "$GITHUB_ENV" <<'EOF'
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          ok = [h for h in range(-96, 97) if (now + timedelta(hours=h)).weekday() < 5
                and (now + timedelta(hours=h)).hour == 14]
          h = min(ok, key=abs)
          print(f"NETGEN_UTC_OFFSET_HOURS={h + (30 - now.minute) / 60:.2f}")
          EOF
          grep NETGEN_UTC_OFFSET_HOURS "$GITHUB_ENV"
          echo "runner: $(nproc) vCPU, $(free -g | awk '/Mem:/ {print $2}') GB"
      - name: start the stack
        run: make up
      - name: let traffic build up
        run: sleep 240
      - name: integration tests
        working-directory: etl
        run: |
          set -a; . ../.env.stack; set +a
          uv sync --frozen
          uv run pytest -m integration -v
      - name: stack state on failure
        if: failure()
        run: |
          docker compose --env-file .env.stack ps -a
          docker compose --env-file .env.stack logs --tail=200 > stack-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: stack-logs
          path: stack-logs.txt
          retention-days: 7
      - name: stop
        if: always()
        run: docker compose --env-file .env.stack down -v

  images:
    # main only: build the images the server runs, for both architectures, scan, publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: netgen
            context: generator
            dockerfile: generator/Dockerfile
          - name: flowetl
            context: .
            dockerfile: etl/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: scan image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image scan/${{ matrix.name }}:ci
          --severity CRITICAL --ignore-unfixed --exit-code 1
      - name: push amd64 + arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
