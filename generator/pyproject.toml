[project]
name = "netgen"
version = "0.1.0"
description = "synthetic half-flow metadata for a bank branch WAN (no payloads)"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.1",
    "orjson>=3.12.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
netgen = "netgen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netgen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/netgen/apps.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
