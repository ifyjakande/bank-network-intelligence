[project]
name = "flowetl"
version = "0.1.0"
description = "schema migrations, inventory load and half-flow stitching for the network quality store"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=1.9.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
flowetl = "flowetl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowetl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the running compose stack"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
